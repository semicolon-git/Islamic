<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>CoolCairo Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A mission-based game that teaches urban heat, satellite remote sensing and every part of the CoolCairo method.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a mission console. A heads-up bar (XP, rank) over either the mission map (four acts as
   orbit rings of stations) or a mission page that reads top to bottom: briefing, lab, field, checkpoint.
   Palette from the subject: thermal night, heat orange for hot, cool teal for cool and for actions,
   gold for earned XP. Data colours never change with the theme. */
:root {
  --bg: #0b1220;
  --bg-2: #0f1829;
  --panel: #131e33;
  --panel-2: #1a2742;
  --line: #263652;
  --ink: #e6edf5;
  --muted: #93a3b8;
  --cool: #3fc1d4;
  --cool-ink: #04222a;
  --heat: #f06a35;
  --gold: #f2c14e;
  --good: #4cd08a;
  --bad: #ff7a59;
  --grid: rgb(147 163 184 / 0.16);
  --shadow: 0 10px 30px rgb(0 0 0 / 0.35);
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef2f6; --bg-2: #e4eaf1; --panel: #ffffff; --panel-2: #f1f5f9; --line: #d3dce6;
    --ink: #142033; --muted: #56677d; --cool: #0b7285; --cool-ink: #ffffff; --heat: #c9501f;
    --gold: #a77b0f; --good: #16865a; --bad: #c2481d; --grid: rgb(20 32 51 / 0.09);
    --shadow: 0 8px 24px rgb(20 32 51 / 0.10); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef2f6; --bg-2: #e4eaf1; --panel: #ffffff; --panel-2: #f1f5f9; --line: #d3dce6;
  --ink: #142033; --muted: #56677d; --cool: #0b7285; --cool-ink: #ffffff; --heat: #c9501f;
  --gold: #a77b0f; --good: #16865a; --bad: #c2481d; --grid: rgb(20 32 51 / 0.09);
  --shadow: 0 8px 24px rgb(20 32 51 / 0.10); color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--cool); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
svg text { font-family: var(--font-data); }
.mono { font-family: var(--font-data); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; font-stretch: 82%; line-height: 1.02; letter-spacing: -0.01em; }
h2 { font-size: 24px; font-weight: 750; font-stretch: 85%; line-height: 1.15; }
h3 { font-size: 17px; font-weight: 700; font-stretch: 90%; }
.eyebrow { font: 600 11.5px var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.prose { max-width: 70ch; display: grid; gap: 12px; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.prose b { color: var(--ink); }
.hl-heat { color: var(--heat); font-weight: 600; }
.hl-cool { color: var(--cool); font-weight: 600; }

/* ---------- HUD ---------- */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo-mark { width: 30px; height: 30px; flex: none; }
.logo b { font: 800 18px/1 var(--font-display); font-stretch: 80%; display: block; }
.logo span { font: 500 11px var(--font-data); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.hud-xp { flex: 1; min-width: 160px; display: grid; gap: 4px; max-width: 360px; margin-left: auto; }
.hud-xp-top { display: flex; justify-content: space-between; font: 500 12px var(--font-data); color: var(--muted); }
.hud-xp-top b { color: var(--gold); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--heat)); border-radius: 99px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
.hud-btns { display: flex; gap: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 600; font-size: 13px;
}
.chip-btn:hover { border-color: var(--cool); }
.chip-btn svg { width: 16px; height: 16px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.wrap {
  max-width: 1180px; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- home / mission map ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero p.lead { font-size: 17px; color: var(--muted); max-width: 56ch; margin-top: 14px; }
.hero-stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 20px; }
.stat b { display: block; font: 700 26px/1 var(--font-display); font-stretch: 85%; }
.stat span { font: 500 11.5px var(--font-data); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.globe { width: 100%; max-width: 460px; aspect-ratio: 1; justify-self: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); cursor: pointer;
  font-weight: 700; font-size: 14px; text-decoration: none; color: var(--ink); transition: transform 0.06s, background 0.15s, border-color 0.15s;
}
.btn:hover { border-color: var(--cool); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--cool); border-color: var(--cool); color: var(--cool-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.acts { display: grid; gap: 34px; margin-top: 44px; }
.act-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.act-head .eyebrow { color: var(--cool); }
.act-head p { color: var(--muted); max-width: 70ch; }
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.station {
  position: relative; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; text-align: left;
  padding: 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); cursor: pointer;
  text-decoration: none; color: var(--ink); transition: transform 0.15s, border-color 0.15s;
}
.station:hover { transform: translateY(-2px); border-color: var(--cool); }
.station .st-no {
  grid-row: span 3; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  font: 700 15px var(--font-data); border: 2px solid var(--line); background: var(--bg-2);
}
.station.done .st-no { border-color: var(--gold); color: var(--gold); }
.station .st-title { font: 700 16px/1.25 var(--font-display); font-stretch: 90%; }
.station .st-sub { font-size: 13px; color: var(--muted); }
.station .st-meta { display: flex; gap: 8px; align-items: center; font: 500 11.5px var(--font-data); color: var(--muted); }
.stars { color: var(--gold); letter-spacing: 1px; }

/* ---------- mission page ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; font: 500 12.5px var(--font-data); color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
.crumbs a { text-decoration: none; }
.ch-head { display: grid; gap: 10px; margin-bottom: 22px; }
.ch-head p { color: var(--muted); font-size: 17px; max-width: 64ch; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: fit-content; max-width: 100%; overflow-x: auto; }
.tabs a { padding: 7px 14px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--panel-2); }
.sec { display: grid; gap: 16px; padding-top: 34px; scroll-margin-top: 80px; }
.sec-title { display: flex; align-items: center; gap: 12px; }
.sec-title .tag { font: 600 11px var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.sec-title .tag.t-lab { color: var(--cool); border-color: color-mix(in srgb, var(--cool) 50%, transparent); }
.sec-title .tag.t-field { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.sec-title .tag.t-quiz { color: var(--heat); border-color: color-mix(in srgb, var(--heat) 50%, transparent); }
.brief { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); gap: 26px; align-items: start; }
.keybox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.keybox .kv { display: grid; gap: 2px; }
.keybox .kv b { font: 700 22px/1.1 var(--font-display); font-stretch: 85%; color: var(--ink); }
.keybox .kv span { font-size: 12.5px; color: var(--muted); }
.note { border-left: 3px solid var(--cool); background: var(--panel); padding: 12px 14px; border-radius: 0 10px 10px 0; font-size: 14px; }
.note.heat { border-left-color: var(--heat); }
.note.gold { border-left-color: var(--gold); }
.note b { color: var(--ink); }

.lab { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.lab-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(220px, 1fr); gap: 18px; align-items: start; }
.lab-ctrl { display: grid; gap: 12px; align-content: start; }
.lab h3 { display: flex; align-items: center; gap: 8px; }
.lab .hint { font-size: 13px; color: var(--muted); }
.ctl { display: grid; gap: 4px; }
.ctl label, .ctl .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.ctl output { font: 600 13px var(--font-data); color: var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--cool); margin: 0; height: 24px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 4px rgb(0 0 0 / 0.25); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.ro { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.ro span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.ro b { font: 700 20px/1.15 var(--font-display); font-stretch: 85%; font-variant-numeric: tabular-nums; }
.ro b.good { color: var(--good); } .ro b.bad { color: var(--bad); } .ro b.heat { color: var(--heat); } .ro b.cool { color: var(--cool); } .ro b.gold { color: var(--gold); }
.viz { width: 100%; max-width: 100%; display: block; }
svg.viz { max-height: 420px; }
.viz-box { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
canvas.viz { image-rendering: pixelated; touch-action: none; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend-row i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.table-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
table.t td.n, table.t th.n { text-align: right; font-family: var(--font-data); }
table.t tr.me td { color: var(--cool); font-weight: 600; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.fcard .where { font: 600 11.5px var(--font-data); color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; }
.fcard h3 { font-size: 16px; }
.fcard p { font-size: 14px; color: var(--muted); }
.fcard .link { font-size: 13px; color: var(--ink); border-top: 1px dashed var(--line); padding-top: 8px; }
.fcard .link b { color: var(--cool); }

/* ---------- quiz ---------- */
.quiz { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 16px; }
.q-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 500 12.5px var(--font-data); color: var(--muted); }
.q-text { font: 650 18px/1.4 var(--font-body); max-width: 70ch; }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2);
  cursor: pointer; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start;
}
.opt .k { font: 600 12px var(--font-data); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; flex: none; margin-top: 2px; }
.opt:hover:not(:disabled) { border-color: var(--cool); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--bg-2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg-2)); }
.opt:disabled { cursor: default; }
.explain { font-size: 14px; padding: 12px 14px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.explain b { color: var(--ink); }
.q-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.result { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
.result .big { font: 800 52px/1 var(--font-display); font-stretch: 80%; color: var(--gold); }

/* ---------- toast, badge pop ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px;
  box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center;
}
.toast .xp { color: var(--gold); }
:root[data-theme="light"] .toast .xp { color: #f2c14e; }

dialog.dlg { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); padding: 0; width: min(760px, calc(100% - 32px)); max-height: calc(100% - 48px); box-shadow: var(--shadow); }
dialog.dlg::backdrop { background: rgb(5 10 18 / 0.6); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.dlg-head h2 { font-size: 18px; margin-right: auto; }
.dlg-body { padding: 16px 18px; display: grid; gap: 12px; }
.gloss input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); }
.gloss dl { margin: 0; display: grid; gap: 10px; }
.gloss dt { font-weight: 700; }
.gloss dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.gloss dd .go { font-size: 12.5px; }

/* flashcards */
.flash { perspective: 1200px; }
.card3d { position: relative; min-height: 230px; transition: transform 0.5s; transform-style: preserve-3d; cursor: pointer; }
.card3d.flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; padding: 22px; display: grid; align-content: center; gap: 10px; border: 1px solid var(--line); background: var(--panel); }
.face.back { transform: rotateY(180deg); background: var(--panel-2); }
.face .q { font: 700 21px/1.3 var(--font-display); font-stretch: 90%; }
.face .a { font-size: 15px; }

.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--muted); }
.badge.on { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 55%, transparent); }

.cert { border: 2px solid var(--gold); border-radius: 18px; padding: 28px; text-align: center; display: grid; gap: 10px; background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--gold) 14%, var(--panel)), var(--panel)); }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 40px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .hero, .brief, .lab-row { grid-template-columns: minmax(0, 1fr); }
  .globe { max-width: 300px; }
  .hud-xp { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }
  .logo span { display: none; }
  .hud-btns { margin-left: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<header class="hud">
  <div class="hud-in">
    <a class="logo" href="#home" aria-label="CoolCairo Academy home">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M16 3a13 13 0 0 1 0 26" fill="none" stroke="var(--heat)" stroke-width="2.4"/><path d="M16 29a13 13 0 0 1 0-26" fill="none" stroke="var(--cool)" stroke-width="2.4"/><circle cx="16" cy="16" r="4.5" fill="var(--gold)"/></svg>
      <div><b>CoolCairo Academy</b><span>Heat · Satellites · Models</span></div>
    </a>
    <div class="hud-xp" aria-label="Progress">
      <div class="hud-xp-top"><span id="rankName">Cadet</span><span><b id="xpNow">0</b> XP · <span id="doneCount">0</span>/16 missions</span></div>
      <div class="bar"><span id="xpBar" style="width:0%"></span></div>
    </div>
    <div class="hud-btns">
      <button class="chip-btn" id="glossBtn" title="Glossary (G)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M5 17a3 3 0 0 1 3-3h11"/></svg>Words</button>
      <button class="chip-btn" id="themeBtn" title="Light / dark" aria-label="Switch light or dark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog class="dlg gloss" id="glossDlg" aria-labelledby="glossTitle">
  <div class="dlg-head">
    <h2 id="glossTitle">Words to know</h2>
    <button class="chip-btn" data-close aria-label="Close">Close</button>
  </div>
  <div class="dlg-body">
    <label class="muted small" for="glossSearch">Search 40 terms from remote sensing, statistics and urban heat</label>
    <input id="glossSearch" type="search" placeholder="Try NDVI, emissivity, R²…" autocomplete="off">
    <dl id="glossList"></dl>
  </div>
</dialog>

<script>
// CoolCairo Academy engine: state, routing, mission map, mission pages, quizzes, exam, glossary.

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "html") e.innerHTML = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of [].concat(kids)) if (c != null) e.append(c);
  return e;
}
function S(tag, attrs = {}, kids = []) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v != null) e.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c != null) e.append(c);
  return e;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const MINUS = "−";
const fmt = (v, d = 1) => (v < 0 ? MINUS : "") + Math.abs(v).toFixed(d);
const fint = (v) => Math.round(v).toLocaleString("en-US");
function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rand) { let u = 0, v = 0; while (u === 0) u = rand(); while (v === 0) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function shuffle(a, rand = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const median = (a) => { const s = a.slice().sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : NaN; };
const mean = (a) => a.reduce((s, v) => s + v, 0) / (a.length || 1);

// Report-style diverging heat ramp: blue (cool) - light grey - orange (hot). Fixed in both themes.
const HEAT_STOPS = [[0, [23, 74, 139]], [0.25, [42, 120, 214]], [0.5, [240, 239, 236]], [0.75, [235, 104, 52]], [1, [156, 58, 20]]];
function heatColor(t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < HEAT_STOPS.length; i++) {
    if (t <= HEAT_STOPS[i][0]) {
      const [t0, c0] = HEAT_STOPS[i - 1], [t1, c1] = HEAT_STOPS[i];
      const f = (t - t0) / (t1 - t0);
      return `rgb(${c0.map((c, k) => Math.round(lerp(c, c1[k], f))).join(" ")})`;
    }
  }
  return "rgb(156 58 20)";
}
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------- state ----------
const STORE_KEY = "coolcairo-academy-v1";
let state = { xp: 0, labs: {}, answered: {}, done: {}, exam: { best: 0 }, flash: {} };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s) state = Object.assign(state, s); } catch { /* storage off */ }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* storage off */ } }

const RANKS = [[0, "Cadet"], [400, "Observer"], [1000, "Analyst"], [1800, "Specialist"], [2600, "Expert"]];
const MAX_XP = 16 * (40 + 4 * 30 + 50) + 20 * 15;
function rank() {
  const done = Object.keys(state.done).length;
  if (done >= 16 && state.exam.best >= 16) return "Super Expert";
  let r = RANKS[0][1];
  for (const [x, n] of RANKS) if (state.xp >= x) r = n;
  return r;
}
function addXP(n, why) {
  if (n <= 0) return;
  const before = rank();
  state.xp += n;
  save();
  renderHud();
  const after = rank();
  toast(`<span class="xp">+${n} XP</span> ${why}${after !== before ? ` · Rank up: <b>${after}</b>` : ""}`);
}
function renderHud() {
  $("#xpNow").textContent = fint(state.xp);
  $("#rankName").textContent = rank();
  $("#doneCount").textContent = Object.keys(state.done).length;
  $("#xpBar").style.width = `${Math.min(100, (100 * state.xp) / MAX_XP)}%`;
}
let toastT = 0;
function toast(html) {
  const t = $("#toast");
  t.innerHTML = html;
  t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => (t.hidden = true), 2800);
}

// ---------- routing ----------
const view = $("#view");
let cleanup = [];
function route() {
  cleanup.forEach((f) => f()); cleanup = [];
  const h = location.hash.slice(1) || "home";
  view.innerHTML = "";
  const m = h.match(/^m(\d+)$/);
  if (m && CHAPTERS[+m[1] - 1]) renderChapter(CHAPTERS[+m[1] - 1]);
  else if (h === "exam") renderExam();
  else renderHome();
  window.scrollTo(0, 0);
  renderHud();
}
window.addEventListener("hashchange", route);

// ---------- home ----------
function starsFor(ch) {
  const a = state.answered[ch.id] || {};
  const right = Object.values(a).filter((v) => v === 1).length;
  return right >= 4 ? 3 : right >= 3 ? 2 : right >= 1 ? 1 : 0;
}
function renderHome() {
  const done = Object.keys(state.done).length;
  const next = CHAPTERS.find((c) => !state.done[c.id]) || CHAPTERS[15];
  const hero = el("section", { class: "hero" }, [
    el("div", {}, [
      el("div", { class: "eyebrow", text: "Team 46 · Hyperspectral course prep" }),
      el("h1", { html: "From a glow in space<br>to a cooler street." }),
      el("p", { class: "lead", text: "Sixteen missions take you from what an urban heat island is, through how satellites measure heat and materials, to every number in CoolCairo and how to defend it. Each mission has a briefing, a hands-on lab, real-world cases and a checkpoint." }),
      el("div", { class: "hero-stats" }, [
        el("div", { class: "stat" }, [el("b", { text: `${done}/16` }), el("span", { text: "missions" })]),
        el("div", { class: "stat" }, [el("b", { text: fint(state.xp) }), el("span", { text: "XP earned" })]),
        el("div", { class: "stat" }, [el("b", { text: rank() }), el("span", { text: "rank" })]),
        el("div", { class: "stat" }, [el("b", { text: state.exam.best ? `${state.exam.best}/20` : "—" }), el("span", { text: "best exam" })]),
      ]),
      el("div", { class: "hero-cta" }, [
        el("a", { class: "btn primary", href: `#m${next.id}`, text: done ? `Continue: ${next.title}` : "Start mission 1" }),
        el("a", { class: "btn", href: "#exam", text: "Final exam" }),
      ]),
    ]),
    globeCanvas(),
  ]);
  view.append(hero);
  const acts = el("div", { class: "acts" });
  for (const act of ACTS) {
    const sec = el("section", {}, [
      el("div", { class: "act-head" }, [el("span", { class: "eyebrow", text: `Act ${act.n}` }), el("h2", { text: act.name }), el("p", { text: act.sub })]),
    ]);
    const grid = el("div", { class: "stations" });
    for (const ch of CHAPTERS.filter((c) => c.act === act.n)) {
      const st = starsFor(ch);
      grid.append(el("a", { class: `station${state.done[ch.id] ? " done" : ""}`, href: `#m${ch.id}` }, [
        el("span", { class: "st-no", text: state.done[ch.id] ? "✓" : String(ch.id) }),
        el("span", { class: "st-title", text: ch.title }),
        el("span", { class: "st-sub", text: ch.sub }),
        el("span", { class: "st-meta" }, [el("span", { class: "stars", text: "★".repeat(st) + "☆".repeat(3 - st) }), el("span", { text: state.labs[ch.id] ? "lab done" : "lab" })]),
      ]));
    }
    sec.append(grid);
    acts.append(sec);
  }
  const badges = el("div", { class: "badges" }, CHAPTERS.map((c) => el("span", { class: `badge${state.done[c.id] ? " on" : ""}`, text: `${state.done[c.id] ? "★" : "☆"} ${c.title}` })));
  acts.append(el("section", {}, [el("div", { class: "act-head" }, [el("span", { class: "eyebrow", text: "Badges" }), el("h2", { text: "Your collection" }), el("p", { text: "Pass a mission's checkpoint (3 of 4) to earn its badge. All 16 badges and 16/20 on the final exam make you a Super Expert." })]), badges]));
  view.append(acts);
}

// Animated hero: a thermal Earth limb with a satellite sweeping its swath.
function globeCanvas() {
  const c = el("canvas", { class: "globe", width: 460, height: 460, role: "img", "aria-label": "A satellite crossing a thermal view of Earth" });
  const ctx = c.getContext("2d");
  const rand = mulberry32(7);
  const spots = Array.from({ length: 160 }, () => ({ a: rand() * Math.PI * 2, r: Math.sqrt(rand()) * 0.92, t: rand(), s: 4 + rand() * 14 }));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf = 0, t0 = performance.now();
  function draw(now) {
    const t = reduced ? 1.2 : (now - t0) / 1000;
    const W = 460, cx = 230, cy = 230, R = 170;
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = "#16263f"; ctx.fillRect(0, 0, W, W);
    for (const p of spots) {
      const ang = p.a + t * 0.05;
      const x = cx + Math.cos(ang) * p.r * R, y = cy + Math.sin(ang) * p.r * R * 0.96;
      ctx.fillStyle = heatColor(p.t);
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(x, y, p.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // swath
    const sx = cx + Math.sin(t * 0.6) * R * 0.7;
    const g = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0);
    g.addColorStop(0, "rgba(63,193,212,0)"); g.addColorStop(0.5, "rgba(63,193,212,0.28)"); g.addColorStop(1, "rgba(63,193,212,0)");
    ctx.fillStyle = g; ctx.fillRect(sx - 40, 0, 80, W);
    ctx.restore();
    // limb + orbit
    ctx.strokeStyle = "rgba(147,163,184,0.5)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.22, R * 0.38, -0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    const oa = t * 0.6;
    const ox = cx + Math.cos(oa) * R * 1.22, oy = cy + Math.sin(oa) * R * 0.38;
    const rx = (ox - cx) * Math.cos(-0.5) - (oy - cy) * Math.sin(-0.5) + cx;
    const ry = (ox - cx) * Math.sin(-0.5) + (oy - cy) * Math.cos(-0.5) + cy;
    ctx.fillStyle = "#f2c14e"; ctx.fillRect(rx - 6, ry - 3, 12, 6);
    ctx.fillStyle = "#3fc1d4"; ctx.fillRect(rx - 16, ry - 2, 8, 4); ctx.fillRect(rx + 8, ry - 2, 8, 4);
    ctx.font = "12px IBM Plex Mono, monospace"; ctx.fillStyle = "rgba(230,237,245,0.85)";
    ctx.fillText("LANDSAT · 10:30 am pass", 18, 444);
    if (!reduced) raf = requestAnimationFrame(draw);
  }
  raf = requestAnimationFrame(draw);
  cleanup.push(() => cancelAnimationFrame(raf));
  return c;
}

// ---------- mission page ----------
function renderChapter(ch) {
  const act = ACTS[ch.act - 1];
  view.append(el("div", { class: "crumbs" }, [el("a", { href: "#home", text: "Mission map" }), el("span", { text: "/" }), el("span", { text: `Act ${act.n} · ${act.name}` })]));
  view.append(el("header", { class: "ch-head" }, [
    el("div", { class: "eyebrow", text: `Mission ${ch.id} of 16${state.done[ch.id] ? " · badge earned" : ""}` }),
    el("h1", { text: ch.title }),
    el("p", { text: ch.sub }),
  ]));
  view.append(el("nav", { class: "tabs", "aria-label": "Sections" }, [
    el("a", { href: `#m${ch.id}`, onclick: (e) => jump(e, "brief"), text: "Briefing" }),
    el("a", { href: `#m${ch.id}`, onclick: (e) => jump(e, "lab"), text: "Lab" }),
    el("a", { href: `#m${ch.id}`, onclick: (e) => jump(e, "field"), text: "In the field" }),
    el("a", { href: `#m${ch.id}`, onclick: (e) => jump(e, "check"), text: "Checkpoint" }),
  ]));

  // briefing
  const keys = el("aside", { class: "keybox" }, [el("div", { class: "eyebrow", text: "Numbers to remember" }), ...ch.keys.map(([b, s]) => el("div", { class: "kv" }, [el("b", { text: b }), el("span", { text: s })]))]);
  const brief = el("section", { class: "sec", id: "brief" }, [
    el("div", { class: "sec-title" }, [el("span", { class: "tag", text: "Briefing" }), el("h2", { text: "What you need to know" })]),
    el("div", { class: "brief" }, [el("div", { class: "prose", html: ch.brief }), keys]),
  ]);
  if (ch.note) brief.append(el("div", { class: `note ${ch.note.kind}`, html: ch.note.html }));
  view.append(brief);

  // lab
  const labBox = el("div", { class: "lab" });
  view.append(el("section", { class: "sec", id: "lab" }, [
    el("div", { class: "sec-title" }, [el("span", { class: "tag t-lab", text: "Lab" }), el("h2", { text: ch.labTitle })]),
    el("p", { class: "muted", text: ch.labHint }),
    labBox,
  ]));
  const api = {
    award(why = "Lab explored") {
      if (state.labs[ch.id]) return;
      state.labs[ch.id] = 1; save(); addXP(40, why);
    },
    onCleanup(f) { cleanup.push(f); },
  };
  try { LABS[ch.lab](labBox, api); } catch (err) { labBox.append(el("p", { class: "muted", text: `This lab could not start: ${err.message}` })); console.error(err); }

  // field
  view.append(el("section", { class: "sec", id: "field" }, [
    el("div", { class: "sec-title" }, [el("span", { class: "tag t-field", text: "In the field" }), el("h2", { text: "Where this is used in the real world" })]),
    el("div", { class: "fields" }, ch.field.map((f) => el("article", { class: "fcard" }, [
      el("span", { class: "where", text: f.where }), el("h3", { text: f.title }), el("p", { text: f.text }),
      el("div", { class: "link", html: `<b>Link to CoolCairo:</b> ${f.link}` }),
    ]))),
  ]));

  // checkpoint
  const qbox = el("div");
  view.append(el("section", { class: "sec", id: "check" }, [
    el("div", { class: "sec-title" }, [el("span", { class: "tag t-quiz", text: "Checkpoint" }), el("h2", { text: "Earn the badge" })]),
    el("p", { class: "muted", text: "Four questions. First-try right answers earn 30 XP each; 3 of 4 earns the badge and a 50 XP bonus." }),
    qbox,
  ]));
  runQuiz(qbox, ch.quiz.map((q, i) => ({ ...q, key: `${ch.id}:${i}` })), {
    onAnswer(q, right) {
      const a = (state.answered[ch.id] ||= {});
      const idx = q.key.split(":")[1];
      if (a[idx] === undefined) { a[idx] = right ? 1 : 0; save(); if (right) addXP(30, "Correct"); }
    },
    onFinish(score) {
      if (score >= 3 && !state.done[ch.id]) { state.done[ch.id] = 1; save(); addXP(50, `Badge: ${ch.title}`); }
      return score >= 3 ? `Badge earned: ${ch.title}` : "Score 3 of 4 to earn the badge. Read the explanations and try again.";
    },
  });

  // pager
  const prev = CHAPTERS[ch.id - 2], next = CHAPTERS[ch.id];
  view.append(el("nav", { class: "pager" }, [
    prev ? el("a", { class: "btn", href: `#m${prev.id}`, text: `← ${prev.title}` }) : el("a", { class: "btn", href: "#home", text: "← Mission map" }),
    next ? el("a", { class: "btn primary", href: `#m${next.id}`, text: `${next.title} →` }) : el("a", { class: "btn primary", href: "#exam", text: "Final exam →" }),
  ]));
}
function jump(e, id) { e.preventDefault(); document.getElementById(id)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }

// ---------- quiz engine ----------
function runQuiz(box, questions, { onAnswer, onFinish, shuffleOpts = false, label = "Question" }) {
  let i = 0, score = 0;
  const order = questions.map((q) => {
    const idx = q.opts.map((_, k) => k);
    return shuffleOpts ? shuffle(idx) : idx;
  });
  function show() {
    box.innerHTML = "";
    const q = questions[i];
    const card = el("div", { class: "quiz" });
    card.append(el("div", { class: "q-top" }, [el("span", { text: `${label} ${i + 1} of ${questions.length}` }), el("span", { text: `Score ${score}` })]));
    card.append(el("div", { class: "q-text", text: q.q }));
    const opts = el("div", { class: "opts" });
    const explain = el("div", { class: "explain", hidden: true });
    const foot = el("div", { class: "q-foot" });
    const nextBtn = el("button", { class: "btn primary", hidden: true, text: i === questions.length - 1 ? "See result" : "Next question" });
    const buttons = order[i].map((oi, k) => el("button", { class: "opt", "data-oi": oi }, [el("span", { class: "k", text: "ABCD"[k] }), el("span", { text: q.opts[oi] })]));
    function choose(btn) {
      const oi = +btn.dataset.oi;
      const right = oi === q.a;
      if (right) score++;
      buttons.forEach((b) => { b.disabled = true; if (+b.dataset.oi === q.a) b.classList.add("right"); });
      if (!right) btn.classList.add("wrong");
      explain.innerHTML = `<b>${right ? "Right." : "Not quite."}</b> ${q.why}`;
      explain.hidden = false;
      nextBtn.hidden = false;
      nextBtn.focus();
      onAnswer?.(q, right);
    }
    buttons.forEach((b) => b.addEventListener("click", () => choose(b)));
    opts.append(...buttons);
    nextBtn.addEventListener("click", () => { i++; if (i < questions.length) show(); else finish(); });
    foot.append(el("span", { class: "muted small", text: "Keys 1–4 answer · Enter continues" }), nextBtn);
    card.append(opts, explain, foot);
    box.append(card);
    keyHandler = (e) => {
      if (document.querySelector("dialog[open]")) return;
      const tag = (e.target.tagName || "");
      if (tag === "INPUT") return;
      if (e.key >= "1" && e.key <= "4" && !buttons[0].disabled) { const b = buttons[+e.key - 1]; if (b) choose(b); }
      else if (e.key === "Enter" && !nextBtn.hidden && document.activeElement !== nextBtn) nextBtn.click();
    };
  }
  function finish() {
    keyHandler = null;
    box.innerHTML = "";
    const msg = onFinish?.(score) || "";
    box.append(el("div", { class: "quiz" }, [el("div", { class: "result" }, [
      el("div", { class: "big", text: `${score}/${questions.length}` }),
      el("p", { text: msg }),
      el("button", { class: "btn", text: "Try again", onclick: () => { i = 0; score = 0; show(); } }),
    ])]));
  }
  show();
}
let keyHandler = null;
document.addEventListener("keydown", (e) => keyHandler?.(e));

// ---------- final exam ----------
function renderExam() {
  view.append(el("div", { class: "crumbs" }, [el("a", { href: "#home", text: "Mission map" }), el("span", { text: "/" }), el("span", { text: "Final exam" })]));
  view.append(el("header", { class: "ch-head" }, [
    el("div", { class: "eyebrow", text: "Certification" }),
    el("h1", { text: "The expert exam" }),
    el("p", { text: "Twenty questions drawn at random from all sixteen missions, answers shuffled. Score 16 or more, with all sixteen badges, to become a CoolCairo Super Expert." }),
  ]));
  const box = el("div");
  view.append(box);
  const pool = CHAPTERS.flatMap((c) => c.quiz.map((q) => ({ ...q, from: c.title })));
  const start = () => {
    const qs = shuffle(pool).slice(0, 20).map((q) => ({ ...q, why: `${q.why} <span class="muted">(Mission: ${q.from})</span>` }));
    runQuiz(box, qs, {
      shuffleOpts: true,
      onFinish(score) {
        const gain = Math.max(0, score - state.exam.best) * 15;
        if (score > state.exam.best) { state.exam.best = score; save(); }
        if (gain) addXP(gain, "Exam best improved");
        const done = Object.keys(state.done).length;
        setTimeout(() => {
          if (score >= 16) box.prepend(el("div", { class: "cert" }, [
            el("div", { class: "eyebrow", text: "CoolCairo Academy" }),
            el("h2", { text: done >= 16 ? "Super Expert" : "Exam passed" }),
            el("p", { text: done >= 16 ? `Certified: ${score}/20 on the expert exam with all sixteen badges. You can explain and defend every part of CoolCairo.` : `You scored ${score}/20. Earn the remaining ${16 - done} badges to become a Super Expert.` }),
          ]));
        }, 0);
        return score >= 16 ? "Passed. Every explanation above links back to its mission." : `You need 16 to pass. Revisit the missions named in the explanations.`;
      },
    });
  };
  box.append(el("div", { class: "quiz" }, [el("div", { class: "result" }, [
    el("div", { class: "big", text: state.exam.best ? `${state.exam.best}/20` : "20 Qs" }),
    el("p", { text: state.exam.best ? "Your best score so far. Each attempt draws new questions." : "About 10 minutes. You can retake it as often as you like." }),
    el("button", { class: "btn primary", text: "Start the exam", onclick: start }),
  ])]));
}

// ---------- glossary ----------
function renderGlossary(filter = "") {
  const f = filter.trim().toLowerCase();
  const list = $("#glossList");
  list.innerHTML = "";
  for (const [term, meaning, m] of GLOSSARY) {
    if (f && !(term + " " + meaning).toLowerCase().includes(f)) continue;
    list.append(el("div", {}, [el("dt", { text: term }), el("dd", {}, [document.createTextNode(meaning + " "), el("a", { class: "go", href: `#m${m}`, text: `Mission ${m} →`, onclick: () => $("#glossDlg").close() })])]));
  }
  if (!list.children.length) list.append(el("p", { class: "muted", text: "No term matches. Try a shorter word." }));
}
$("#glossBtn").addEventListener("click", () => { renderGlossary($("#glossSearch").value); $("#glossDlg").showModal(); $("#glossSearch").focus(); });
$("#glossSearch").addEventListener("input", (e) => renderGlossary(e.target.value));
$("#glossDlg").addEventListener("click", (e) => { if (e.target.id === "glossDlg" || e.target.closest("[data-close]")) $("#glossDlg").close(); });
document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "g" && !document.querySelector("dialog[open]") && !/INPUT|TEXTAREA/.test(e.target.tagName) && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $("#glossBtn").click(); }
});

// ---------- theme ----------
$("#themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("coolcairo-academy-theme", root.dataset.theme); } catch { /* storage off */ }
  route();
});
try { const t = localStorage.getItem("coolcairo-academy-theme"); if (t) document.documentElement.dataset.theme = t; } catch { /* storage off */ }

      <p>The satellite tells us how hot every block is <b>today</b>. It cannot tell us what would happen <b>if</b> we changed the block.

      <p><b>Linear regression</b> finds a formula that is a plain weighted sum. Each share is a fraction of the block (0.3 = 30%):</p>
      <p class="mono" style="background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:12px">Temperature = 45.83 − 3.15·veg + 3.36·sand + 0.12·asphalt<br>+ 2.29·roofs − 11.28·dark roofs − 0.062·height (m)</p>
      <p>Pale ground is the starting point: a block of only pale ground is 45.83 °C. Each coefficient is the change if the <b>whole</b> block
      switched to that surface: all plants 3.15 °C cooler, all sand 3.36 °C hotter. Half a block of sand adds half.</p>
      <p><b>Where the numbers come from:</b> 2,538 built-up blocks (at least 10% roof) with known Landsat temperatures. The computer picks

      <p><b>MAE (mean absolute error)</b> is the average size of a miss. CoolCairo's <b>±1.2 °C</b> means a prediction is on average
      1.2 °C above or below the real temperature.</p>
      <p><b>R²</b> compares the model with a lazy guess: "every block has the average temperature". It measures how much of the lazy
      guess's error the model removes:</p>
      <p class="mono" style="background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:12px">R² = 1 − (model's squared misses ÷ lazy guess's squared misses)</p>

    id: 11, act: 3, title: "The hidden-areas exam", sub: "Spatial cross-validation and why random tests cheat",
    brief: `
      <p>To know if a model works you must test it on blocks it did <b>not</b> learn from. <b>Cross-validation</b> splits the data into groups,
      learns from some, tests on the rest, and rotates so every group is tested once.</p>
      <p><b>The trap:</b> with random groups, a hidden block usually has a neighbour in the learning set, and neighbours are almost identical.
      The model "copies" from next door and the score looks far better than it is. Geographers call this <b>Tobler's first law</b>:
      near things are more related than distant things.</p>
      <p><b>The fix, spatial cross-validation:</b> hide <b>whole areas</b>. The map is cut into <b>1 km × 1 km</b> squares (about 11 × 11 blocks).
      All blocks in a square stay together, and the squares are split into <b>5 groups</b>. Learn from 4, test on the 5th, repeat until every
      square has been hidden once.</p>
      <p>Like testing a student on a whole chapter they never studied instead of questions next to the ones they practised. The score is lower
      but honest, and it is the same situation as using the model in a new district. For the hyperspectral test, 2 km and 3 km squares made the exam even harder.</p>`,

      <p><b>Albedo</b> is how much sunlight a surface reflects (0 = all absorbed, 1 = all reflected). Raise it and the surface heats less.

    id: 13, act: 4, title: "Hyperspectral data", sub: "203 bands, a fair test, and a control",
    brief: `
      <p><b>Multispectral</b> sensors (Sentinel-2) record a few wide bands. <b>Hyperspectral</b> sensors record hundreds of narrow, contiguous bands, a full
      spectrum per pixel. <b>EnMAP</b>, the German hyperspectral satellite launched in 2022, gives 30 m pixels and, after removing water-vapour bands,
      <b>203 usable bands</b>. DLR delivers it atmospherically corrected (L2A).</p>
      <p><b>The research test</b> (separate from the app's model) ran the same hidden-areas exam three times:</p>
      <div class="table-wrap"><table class="t"><tr><th>Inputs</th><th class="n">R² (hidden areas)</th></tr>
      <tr><td>Model ingredients only</td><td class="n">0.25</td></tr><tr><td>Ingredients + Sentinel-2 (6 bands)</td><td class="n">0.40</td></tr>
      <tr><td>Ingredients + EnMAP (203 bands)</td><td class="n">0.58</td></tr></table></div>
      <p>The unexplained part drops from 60% to 42%. With hundreds of inputs a plain regression becomes unstable, so the test uses
      <b>ridge regression</b>, which shrinks coefficients to stay stable.</p>
      <p><b>The control.</b> EnMAP and Sentinel-2 also differ in date, satellite and pixel size. So the team built a "fake Sentinel-2" from EnMAP itself by
      averaging its narrow bands into Sentinel-2's six. Same date, same pixels, only the number of bands differs. Spectra alone: real Sentinel-2
      <b>0.31</b>, cut-down EnMAP <b>0.33</b>, full EnMAP <b>0.53</b>. The gain comes from the <b>spectral detail</b>.</p>
      <p>Not everything improves: for telling buildings from desert, 58 days of Sentinel-2 (0.86) beat one EnMAP date (0.82). EnMAP is not in the app

// Shared chart frame: an SVG with a plot area and linear scales.
function frame(w, h, { l = 44, r = 14, t = 14, b = 34, x = [0, 1], y = [0, 1], xlog = false } = {}) {
  const svg = S("svg", { viewBox: `0 0 ${w} ${h}`, class: "viz", role: "img" });
  const X = xlog
    ? (v) => l + ((Math.log10(v) - Math.log10(x[0])) / (Math.log10(x[1]) - Math.log10(x[0]))) * (w - l - r)
    : (v) => l + ((v - x[0]) / (x[1] - x[0])) * (w - l - r);
  const Y = (v) => t + (1 - (v - y[0]) / (y[1] - y[0])) * (h - t - b);
  return { svg, X, Y, l, r, t, b, w, h };
}
function gridY(f, ticks, label = (v) => v) {
  for (const v of ticks) {
    f.svg.append(S("line", { x1: f.l, x2: f.w - f.r, y1: f.Y(v), y2: f.Y(v), stroke: "var(--grid)" }));
    f.svg.append(S("text", { x: f.l - 6, y: f.Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)", text: label(v) }));
  }
}
function gridX(f, ticks, label = (v) => v) {
  for (const v of ticks) {
    f.svg.append(S("line", { x1: f.X(v), x2: f.X(v), y1: f.t, y2: f.h - f.b, stroke: "var(--grid)" }));
    f.svg.append(S("text", { x: f.X(v), y: f.h - f.b + 16, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)", text: label(v) }));
  }
}
function path(points, attrs) { return S("path", { d: points.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(""), fill: "none", ...attrs }); }
function ctl(id, label, min, max, step, value, fmtOut = (v) => v) {
  const out = el("output", { for: id, text: fmtOut(value) });
  const input = el("input", { type: "range", id, min, max, step, value });
  const wrap = el("div", { class: "ctl" }, [el("label", { for: id }, [document.createTextNode(label), out]), input]);
  input.addEventListener("input", () => (out.textContent = fmtOut(+input.value)));
  return { wrap, input, out };
}
function ro(label, cls = "") { const b = el("b", { class: cls, text: "—" }); return { wrap: el("div", { class: "ro" }, [el("span", { text: label }), b]), b }; }
function seg(options, value, onPick) {
  const s = el("div", { class: "seg", role: "group" });
  const btns = options.map(([v, label]) => {
    const b = el("button", { type: "button", "aria-pressed": String(v === value), text: label });
    b.addEventListener("click", () => { btns.forEach((x) => x.setAttribute("aria-pressed", String(x === b))); onPick(v); });
    return b;
  });
  s.append(...btns);
  return s;
}

LABS.uhi = (box, api) => {

    { k: "Dark roof", min: 29, max: 66, decay: 0.22, col: "#5a5a64" },
    { k: "Asphalt road", min: 31, max: 61, decay: 0.16, col: "#2f3036" },
    { k: "Open sand", min: 22, max: 60, decay: 0.42, col: "#d6b37d" },
    { k: "Pale concrete", min: 29, max: 49, decay: 0.18, col: "#cfc6b4" },
    { k: "Irrigated grass, trees", min: 24, max: 37, decay: 0.3, col: "#548c45" },
    { k: "Air (2 m)", min: 26, max: 38, decay: 0.12, col: "#3fc1d4", dash: "5 4" },
  ];
  // Daytime: half-sine from sunrise 5.5 h with peak near 14 h; night: exponential decay to the minimum.
  function T(s, h) {
    const rise = 5.5, set = 19, peak = 14;
    const d = (hh) => (hh < rise ? 0 : hh <= peak ? Math.sin(((hh - rise) / (peak - rise)) * Math.PI / 2) : hh <= set ? Math.cos(((hh - peak) / (set - peak)) * Math.PI / 2) * 0.9 + 0.1 * Math.cos(((hh - peak) / (set - peak)) * Math.PI / 2) : 0);
    if (h >= rise && h <= set) return s.min + (s.max - s.min) * Math.max(d(h), 0.05);
    const since = h > set ? h - set : h + 24 - set;
    const atSet = s.min + (s.max - s.min) * 0.05;
    return s.min + (atSet - s.min + (s.max - s.min) * 0.25) * Math.exp(-s.decay * since);
  }
  const f = frame(640, 300, { x: [0, 24], y: [15, 70] });
  gridY(f, [20, 30, 40, 50, 60, 70], (v) => `${v}°`);
  gridX(f, [0, 3, 6, 9, 12, 15, 18, 21, 24], (v) => `${v}h`);
  f.svg.append(S("rect", { x: f.X(10.25), y: f.t, width: f.X(10.75) - f.X(10.25), height: f.h - f.t - f.b, fill: "var(--gold)", opacity: 0.25 }));
  f.svg.append(S("text", { x: f.X(10.5), y: f.t + 12, "text-anchor": "middle", "font-size": 10, fill: "var(--gold)", text: "Landsat 10:30" }));
  for (const s of SURF) {
    const pts = []; for (let h = 0; h <= 24; h += 0.25) pts.push([f.X(h), f.Y(T(s, h))]);
    f.svg.append(path(pts, { stroke: s.col, "stroke-width": s.dash ? 2 : 2.4, "stroke-dasharray": s.dash || null }));
  }
  const cursor = S("line", { y1: f.t, y2: f.h - f.b, stroke: "var(--ink)", "stroke-width": 1.2 });
  const dots = SURF.map((s) => S("circle", { r: 4.5, fill: s.col, stroke: "var(--bg-2)", "stroke-width": 1.5 }));
  f.svg.append(cursor, ...dots);

  // street cross-section coloured by current temperature
  const xs = S("svg", { viewBox: "0 0 640 120", class: "viz", role: "img", "aria-label": "Street cross-section" });
  const parts = [
    { s: 4, x: 0, w: 110, y: 70, h: 50 }, { s: 0, x: 110, w: 120, y: 30, h: 90, bld: 1 }, { s: 1, x: 230, w: 150, y: 100, h: 20 },
    { s: 3, x: 380, w: 120, y: 45, h: 75, bld: 1 }, { s: 2, x: 500, w: 140, y: 96, h: 24 },
  ];
  const rects = parts.map((p) => S("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: p.bld ? 2 : 0 }));
  xs.append(...rects);
  const labels = parts.map((p) => S("text", { x: p.x + p.w / 2, y: p.y - 6, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)" }));
  xs.append(...labels);

  const hour = ctl("uhiHour", "Time of day", 0, 24, 0.25, 10.5, (v) => `${String(Math.floor(v)).padStart(2, "0")}:${String(Math.round((v % 1) * 60)).padStart(2, "0")}`);
  const outs = SURF.map((s) => ro(s.k));
  const gap = ro("Hottest surface above the air", "heat");
  function update() {
    const h = +hour.input.value;
    cursor.setAttribute("x1", f.X(h)); cursor.setAttribute("x2", f.X(h));
    SURF.forEach((s, i) => { const v = T(s, h); dots[i].setAttribute("cx", f.X(h)); dots[i].setAttribute("cy", f.Y(v)); outs[i].b.textContent = `${v.toFixed(1)} °C`; });
    const temps = SURF.slice(0, 5).map((s) => T(s, h));
    gap.b.textContent = `+${(Math.max(...temps) - T(SURF[5], h)).toFixed(1)} °C`;
    parts.forEach((p, i) => { const v = T(SURF[p.s], h); rects[i].setAttribute("fill", heatColor((v - 25) / 40)); labels[i].textContent = `${SURF[p.s].k.split(",")[0]} ${v.toFixed(0)}°`; });
  }
  hour.input.addEventListener("input", () => { update(); api.award("Lab: a day of surface heat"); });
  update();
  box.append(
    el("div", { class: "viz-box" }, f.svg),
    el("div", { class: "legend-row" }, SURF.map((s) => el("span", {}, [el("i", { style: `background:${s.col}` }), document.createTextNode(s.k)]))),
    el("div", { class: "viz-box" }, xs),

  );
};

// ---------------------------------------------------------------- 2. spectrum & Planck
LABS.spectrum = (box, api) => {
  const h = 6.626e-34, c = 2.998e8, k = 1.381e-23;
  const planck = (lamUm, T) => { const l = lamUm * 1e-6; return (2 * h * c * c) / (l ** 5) / (Math.exp((h * c) / (l * k * T)) - 1); };
  const f = frame(660, 300, { x: [0.3, 20], y: [0, 1.08], xlog: true, b: 40 });
  gridX(f, [0.4, 0.7, 1, 2, 3, 5, 10, 15, 20], (v) => `${v}`);
  f.svg.append(S("text", { x: f.w / 2, y: f.h - 4, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)", text: "wavelength (µm, log scale)" }));
  // atmospheric absorption (approximate)
  for (const [a, b2] of [[1.35, 1.45], [1.8, 1.95], [2.5, 3.4], [4.2, 4.4], [5.2, 7.8], [14, 20]]) {
    f.svg.append(S("rect", { x: f.X(a), y: f.t, width: f.X(b2) - f.X(a), height: f.h - f.t - f.b, fill: "var(--muted)", opacity: 0.13 }));
  }
  f.svg.append(S("text", { x: f.X(6.2), y: f.t + 14, "text-anchor": "middle", "font-size": 10, fill: "var(--muted)", text: "absorbed by water vapour" }));
  // visible rainbow strip
  const grad = S("linearGradient", { id: "vis", x1: 0, x2: 1 }, [["#7b2cff", 0], ["#2a6bff", 0.2], ["#21c25b", 0.45], ["#ffd23f", 0.7], ["#ff3b30", 1]].map(([col, o]) => S("stop", { offset: o, "stop-color": col })));
  f.svg.append(S("defs", {}, grad));
  f.svg.append(S("rect", { x: f.X(0.4), y: f.h - f.b - 6, width: f.X(0.7) - f.X(0.4), height: 6, fill: "url(#vis)" }));
  const BANDS = [
    { n: "B2 blue", a: 0.458, b: 0.523, col: "#2a78d6", d: "Blue: part of visible brightness and the soil index." },
    { n: "B3 green", a: 0.543, b: 0.578, col: "#21a35b", d: "Green: part of visible brightness." },
    { n: "B4 red", a: 0.65, b: 0.68, col: "#e0452f", d: "Red: plants absorb it to photosynthesise, so it is low for vegetation (NDVI)." },
    { n: "B8 NIR", a: 0.785, b: 0.9, col: "#9c6ade", d: "Near-infrared: healthy leaves reflect it strongly. High NIR + low red = high NDVI." },
    { n: "B11 SWIR", a: 1.565, b: 1.655, col: "#c08a3e", d: "Short-wave infrared: sand and soil reflect it strongly (soil index)." },
    { n: "B12 SWIR", a: 2.1, b: 2.28, col: "#a8692a", d: "Second short-wave infrared band: also sensitive to soil and minerals." },
    { n: "Landsat B10 thermal", a: 10.6, b: 11.19, col: "#f06a35", d: "Thermal infrared at ~10.9 µm: the heat glow that gives land surface temperature." },
  ];
  const bandRects = BANDS.map((bd) => {
    const r = S("rect", { x: f.X(bd.a), y: f.t, width: Math.max(3, f.X(bd.b) - f.X(bd.a)), height: f.h - f.t - f.b, fill: bd.col, opacity: 0.32, style: "cursor:pointer" });
    r.addEventListener("click", () => { info.innerHTML = `<b>${bd.n}</b> (${bd.a}–${bd.b} µm). ${bd.d}`; api.award("Lab: bands explored"); });
    f.svg.append(r);
    return r;
  });
  void bandRects;
  const sunPath = S("path", { fill: "none", stroke: "var(--gold)", "stroke-width": 2.4 });
  const earthPath = S("path", { fill: "none", stroke: "var(--heat)", "stroke-width": 2.4 });
  const peakLine = S("line", { y1: f.t, y2: f.h - f.b, stroke: "var(--heat)", "stroke-dasharray": "3 3" });
  const peakTxt = S("text", { "font-size": 11, fill: "var(--heat)" });
  f.svg.append(sunPath, earthPath, peakLine, peakTxt);
  f.svg.append(S("text", { x: f.X(0.5), y: f.Y(1.04), "text-anchor": "middle", "font-size": 11, fill: "var(--gold)", text: "Sun, 5,800 K" }));
  const sunPts = []; const lams = []; for (let i = 0; i <= 260; i++) lams.push(0.3 * Math.pow(20 / 0.3, i / 260));
  const sunMax = Math.max(...lams.map((l) => planck(l, 5800)));
  for (const l of lams) sunPts.push([f.X(l), f.Y(planck(l, 5800) / sunMax)]);
  sunPath.setAttribute("d", sunPts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(""));
  const temp = ctl("specT", "Surface temperature", -20, 80, 1, 47, (v) => `${v} °C`);
  const peak = ro("Peak glow (Wien's law)", "heat"), ratio = ro("Glow vs a 25 °C surface", "gold");
  const info = el("div", { class: "note", html: "Click a coloured band to see what CoolCairo uses it for." });
  function update() {
    const T = +temp.input.value + 273.15;

  update();
  box.append(el("div", { class: "viz-box" }, f.svg), el("div", { class: "lab-row" }, [
    el("div", { class: "lab-ctrl" }, [temp.wrap, el("div", { class: "readout" }, [peak.wrap, ratio.wrap])]),
    el("div", { class: "lab-ctrl" }, [info, el("p", { class: "hint", text: "Each curve is scaled to its own peak so both fit: in absolute terms the Sun's glow is millions of times stronger. 'Glow vs 25 °C' uses the Stefan–Boltzmann law (T⁴)." })]),
  ]));
};

// ---------------------------------------------------------------- 3. resolution
LABS.resolution = (box, api) => {
  // A made-up 540 m × 540 m neighbourhood at 2 m per pixel (270 × 270), as material codes.
  const N = 270, M = new Uint8Array(N * N); // 0 pale ground 1 asphalt 2 pale roof 3 dark roof 4 veg 5 sand
  const rand = mulberry32(42);
  M.fill(0);
  const fill = (x0, y0, w, h, v) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) if (x >= 0 && y >= 0 && x < N && y < N) M[y * N + x] = v; };
  for (let k = 0; k < N; k += 45) { fill(k, 0, 6, N, 1); fill(0, k, N, 6, 1); }
  for (let by = 0; by < 6; by++) for (let bx = 0; bx < 6; bx++) {
    const x0 = bx * 45 + 7, y0 = by * 45 + 7;
    const type = (bx === 4 && by === 1) ? "park" : (bx >= 4 && by >= 4) || (bx === 0 && by === 5) ? "sand" : "built";
    if (type === "park") { fill(x0, y0, 37, 37, 4); continue; }
    if (type === "sand") { fill(x0, y0, 37, 37, 5); if (rand() < 0.5) fill(x0 + 6, y0 + 8, 10, 12, 2); continue; }
    for (let i = 0; i < 6; i++) {
      const w = 8 + Math.floor(rand() * 8), hh = 8 + Math.floor(rand() * 8);
      fill(x0 + Math.floor(rand() * (37 - w)), y0 + Math.floor(rand() * (37 - hh)), w, hh, rand() < 0.2 ? 3 : 2);
    }
    for (let i = 0; i < 5; i++) fill(x0 + Math.floor(rand() * 34), y0 + Math.floor(rand() * 34), 3, 3, 4);
  }
  const RGB = [[219, 212, 194], [56, 56, 61], [236, 230, 214], [90, 90, 100], [84, 140, 69], [214, 179, 125]];
  const TEMP = [45.8, 46.0, 47.0, 44.5, 42.7, 49.2]; // illustrative surface °C per material
  const cv = el("canvas", { class: "viz", width: N, height: N, style: "aspect-ratio:1;max-width:520px;margin:0 auto" });
  const ctx = cv.getContext("2d");
  let px = 2, mode = "colour";
  function draw() {
    const step = px / 2; // in 2 m cells
    const img = ctx.createImageData(N, N);
    for (let by = 0; by < N; by += step) for (let bx = 0; bx < N; bx += step) {
      let r = 0, g = 0, b = 0, t = 0, n = 0;
      for (let y = by; y < Math.min(N, by + step); y++) for (let x = bx; x < Math.min(N, bx + step); x++) { const m = M[y * N + x]; r += RGB[m][0]; g += RGB[m][1]; b += RGB[m][2]; t += TEMP[m]; n++; }
      let col = [r / n, g / n, b / n];
      if (mode === "heat") { const c2 = heatColor((t / n - 42) / 8).match(/\d+/g).map(Number); col = c2; }
      for (let y = by; y < Math.min(N, by + step); y++) for (let x = bx; x < Math.min(N, bx + step); x++) { const o = (y * N + x) * 4; img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255; }
    }
    ctx.putImageData(img, 0, 0);
    if (px >= 30) { ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 0.6; for (let k = 0; k <= N; k += px / 2) { ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k, N); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, k); ctx.lineTo(N, k); ctx.stroke(); } }
    caption.textContent = { 2: "2 m: an aerial photo. Every roof and tree is visible.", 10: "10 m: Sentinel-2. Roofs blur, but streets, the park and sand lots are clear: good for materials.", 30: "30 m: Landsat optical and EnMAP. Single buildings are gone; each pixel is a mix.", 90: "90 m: one CoolCairo block (3 × 3 Landsat pixels). This is the scale the heat sensor can honestly support." }[px];
  }
  const caption = el("p", { class: "hint" });
  const sizes = seg([[2, "2 m aerial"], [10, "10 m Sentinel-2"], [30, "30 m Landsat"], [90, "90 m block"]], 2, (v) => { px = v; draw(); api.award("Lab: resolution"); });
  const modes = seg([["colour", "Colour"], ["heat", "Surface heat (illustrative)"]], "colour", (v) => { mode = v; draw(); api.award("Lab: resolution"); });

  // revisit timeline over one summer (Jun–Aug, 92 days)
  const tl = frame(640, 130, { x: [0, 92], y: [0, 3], l: 110, b: 24 });
  gridX(tl, [0, 30, 61, 92], (v) => ["1 Jun", "1 Jul", "1 Aug", "31 Aug"][[0, 30, 61, 92].indexOf(v)]);
  const rows = [["Landsat 8", 16, 0, "var(--heat)"], ["Landsat 9", 16, 8, "#ff9a6a"], ["Sentinel-2 A+B", 5, 2, "var(--cool)"]];
  rows.forEach(([n, every, off, col], i) => {
    tl.svg.append(S("text", { x: 8, y: tl.Y(2.5 - i) + 4, "font-size": 11, fill: "var(--muted)", text: `${n} · ${every} d` }));
    for (let d = off; d <= 92; d += every) tl.svg.append(S("rect", { x: tl.X(d) - 2, y: tl.Y(2.5 - i) - 7, width: 4, height: 14, rx: 1.5, fill: col }));
  });
  draw();
  box.append(
    el("div", { class: "lab-row" }, [
      el("div", { class: "viz-box", style: "padding:10px" }, cv),
      el("div", { class: "lab-ctrl" }, [el("div", { class: "ctl" }, [el("span", { class: "lbl", text: "Pixel size" }), sizes]), el("div", { class: "ctl" }, [el("span", { class: "lbl", text: "View" }), modes]), caption,
        el("div", { class: "legend-row" }, ["Pale ground", "Asphalt", "Pale roof", "Dark roof", "Vegetation", "Sand"].map((n, i) => el("span", {}, [el("i", { style: `background:rgb(${RGB[i].join(" ")})` }), document.createTextNode(n)])))]),
    ]),
    el("h3", { text: "Temporal resolution: one summer of passes" }),
    el("div", { class: "viz-box" }, tl.svg),
    el("p", { class: "hint", text: "Landsat 8 and 9 together give a pass every 8 days, about 11–12 per summer; three summers and cloud filtering left CoolCairo 65 clear scenes." }),
  );
};

// ---------------------------------------------------------------- 4. thermal sensor
LABS.thermal = (box, api) => {
  const h = 6.626e-34, c = 2.998e8, k = 1.381e-23, LAM = 10.9e-6;
  const B = (T) => (2 * h * c * c) / LAM ** 5 / (Math.exp((h * c) / (LAM * k * T)) - 1);
  const Binv = (L) => (h * c) / (LAM * k) / Math.log(1 + (2 * h * c * c) / (LAM ** 5 * L));
  const ts = ctl("thTs", "True roof surface temperature", 20, 70, 0.5, 48, (v) => `${v} °C`);
  const em = ctl("thEm", "Emissivity", 0.3, 1, 0.01, 0.94, (v) => v.toFixed(2));
  const wv = ctl("thWv", "Water vapour in the air", 0.3, 5, 0.1, 1.5, (v) => `${v.toFixed(1)} g/cm²`);
  const presets = seg([["concrete", "Concrete 0.94"], ["grass", "Grass 0.98"], ["metal", "Bare metal 0.30"], ["paint", "White paint 0.90"]], "concrete", (v) => { em.input.value = { concrete: 0.94, grass: 0.98, metal: 0.3, paint: 0.9 }[v]; em.input.dispatchEvent(new Event("input")); });
  const truth = ro("True surface", "heat"), seen = ro("Seen from space (brightness temp.)", "cool"), err = ro("Error before correction", "bad"), fixed = ro("After USGS-style correction", "good");
  const svg = S("svg", { viewBox: "0 0 640 230", class: "viz", role: "img", "aria-label": "Radiation path from roof to satellite" });
  svg.append(S("rect", { x: 0, y: 190, width: 640, height: 40, fill: "#5a5348" }));
  const roof = S("rect", { x: 250, y: 170, width: 140, height: 24, rx: 2 });
  const atm = S("rect", { x: 0, y: 70, width: 640, height: 80, fill: "var(--cool)" });
  svg.append(atm, roof);
  svg.append(S("text", { x: 12, y: 88, "font-size": 11, fill: "var(--ink)", text: "atmosphere: absorbs part of the glow and adds its own" }));
  svg.append(S("rect", { x: 300, y: 12, width: 40, height: 16, rx: 3, fill: "var(--gold)" }), S("rect", { x: 270, y: 16, width: 26, height: 8, fill: "var(--cool)" }), S("rect", { x: 344, y: 16, width: 26, height: 8, fill: "var(--cool)" }));
  svg.append(S("text", { x: 380, y: 26, "font-size": 11, fill: "var(--muted)", text: "Landsat TIRS, 10.9 µm" }));
  const up = S("line", { x1: 320, y1: 166, x2: 320, y2: 32, stroke: "var(--heat)", "stroke-linecap": "round" });
  const path2 = S("line", { x1: 200, y1: 148, x2: 300, y2: 34, stroke: "var(--cool)", "stroke-width": 2, "stroke-dasharray": "4 4" });
  const refl = S("line", { x1: 420, y1: 120, x2: 375, y2: 168, stroke: "var(--muted)", "stroke-width": 2, "stroke-dasharray": "2 4" });
  svg.append(up, path2, refl);
  svg.append(S("text", { x: 206, y: 140, "font-size": 10, fill: "var(--cool)", text: "air's own glow" }), S("text", { x: 426, y: 128, "font-size": 10, fill: "var(--muted)", text: "sky glow reflected (1 − ε)" }));
  const roofTxt = S("text", { x: 320, y: 214, "text-anchor": "middle", "font-size": 12, fill: "#fff" });
  svg.append(roofTxt);
  let corrected = false;
  const fixBtn = el("button", { class: "btn primary small", text: "Apply the correction" });
  fixBtn.addEventListener("click", () => { corrected = true; update(); api.award("Lab: thermal correction"); });
  function update() {
    const Ts = +ts.input.value + 273.15, e = +em.input.value, w = +wv.input.value;
    const tau = Math.exp(-0.11 * w), Tair = 273.15 + 33;
    const Lup = (1 - tau) * B(Tair - 6), Ldown = (1 - tau) * B(Tair - 2) * 1.15;
    const L = tau * (e * B(Ts) + (1 - e) * Ldown) + Lup;
    const Tb = Binv(L);
    truth.b.textContent = `${(Ts - 273.15).toFixed(1)} °C`;
    seen.b.textContent = `${(Tb - 273.15).toFixed(1)} °C`;
    err.b.textContent = `${fmt(Tb - Ts)} °C`;
    // Correction: invert with known tau, Lup, Ldown and emissivity.
    const Lsurf = ((L - Lup) / tau - (1 - e) * Ldown) / e;
    fixed.b.textContent = corrected ? `${(Binv(Lsurf) - 273.15).toFixed(1)} °C` : "press the button";
    roof.setAttribute("fill", heatColor((Ts - 273.15 - 25) / 40));
    roofTxt.textContent = `roof ${(Ts - 273.15).toFixed(0)} °C · ε ${e.toFixed(2)}`;
    atm.setAttribute("opacity", (0.08 + (1 - tau) * 0.5).toFixed(2));
    up.setAttribute("stroke-width", (2 + 6 * tau * e).toFixed(1));
  }
  for (const c2 of [ts, em, wv]) c2.input.addEventListener("input", () => { corrected = false; update(); api.award("Lab: thermal sensor"); });
  update();
  box.append(el("div", { class: "viz-box" }, svg), el("div", { class: "lab-row" }, [
    el("div", { class: "lab-ctrl" }, [ts.wrap, em.wrap, el("div", { class: "ctl" }, [el("span", { class: "lbl", text: "Emissivity presets" }), presets]), wv.wrap]),
    el("div", { class: "lab-ctrl" }, [el("div", { class: "readout" }, [truth.wrap, seen.wrap, err.wrap, fixed.wrap]), fixBtn,
      el("p", { class: "hint", text: "Try bare metal at 0.30: it looks tens of degrees colder than it is. Then raise the water vapour. The correction needs to know both the air and the emissivity, which is what USGS's Level-2 product does for every scene." })]),
  ]));
};

// ---------------------------------------------------------------- 5. clouds & median
LABS.median = (box, api) => {
  let rand = mulberry32(5), data = [];
  function newPixel() {
    const base = 45.5 + rand() * 2;
    data = Array.from({ length: 13 }, (_, i) => ({ d: i, v: +(base + gauss(rand) * 0.8).toFixed(1), bad: null, flag: false }));
    const idx = shuffle([...Array(13).keys()], rand).slice(0, 3);
    data[idx[0]].v = +(14 + rand() * 10).toFixed(1); data[idx[0]].bad = "cloud";
    data[idx[1]].v = +(26 + rand() * 6).toFixed(1); data[idx[1]].bad = "cloud edge";
    data[idx[2]].v = +(base - 6 - rand() * 3).toFixed(1); data[idx[2]].bad = "cloud shadow";
  }
  newPixel();
  const f = frame(640, 260, { x: [0, 13], y: [0, 55], b: 30 });
  const g = S("g"); f.svg.append(g);
  const meanR = ro("Mean of kept", "bad"), medR = ro("Median of kept", "good"), truthR = ro("Typical clear morning", "gold"), status = el("p", { class: "note" });
  function update() {
    g.innerHTML = "";
    gridY({ ...f, svg: g }, [0, 10, 20, 30, 40, 50], (v) => `${v}°`);
    const kept = data.filter((p) => !p.flag).map((p) => p.v);
    const mv = mean(kept), md = median(kept);
    data.forEach((p, i) => {
      const x = f.X(i + 0.15), w = f.X(0.7) - f.X(0);
      const bar = S("rect", { x, y: f.Y(p.v), width: w, height: f.Y(0) - f.Y(p.v), rx: 3, fill: p.flag ? "var(--line)" : heatColor((p.v - 25) / 30), stroke: p.flag ? "var(--muted)" : "none", "stroke-dasharray": "3 3", style: "cursor:pointer" });
      bar.addEventListener("click", () => { p.flag = !p.flag; update(); api.award("Lab: cleaning a pixel"); });
      g.append(bar, S("text", { x: x + w / 2, y: f.Y(p.v) - 5, "text-anchor": "middle", "font-size": 10.5, fill: "var(--ink)", text: p.v.toFixed(0) }));
      g.append(S("text", { x: x + w / 2, y: f.h - 12, "text-anchor": "middle", "font-size": 10, fill: "var(--muted)", text: `d${i + 1}` }));
    });
    g.append(S("line", { x1: f.l, x2: f.w - f.r, y1: f.Y(mv), y2: f.Y(mv), stroke: "var(--bad)", "stroke-width": 2, "stroke-dasharray": "6 4" }));
    g.append(S("line", { x1: f.l, x2: f.w - f.r, y1: f.Y(md), y2: f.Y(md), stroke: "var(--good)", "stroke-width": 2 }));
    const clear = data.filter((p) => !p.bad).map((p) => p.v);
    meanR.b.textContent = `${mv.toFixed(1)} °C`; medR.b.textContent = `${md.toFixed(1)} °C`; truthR.b.textContent = `${median(clear).toFixed(1)} °C`;
    const caught = data.filter((p) => p.bad && p.flag).length, wrong = data.filter((p) => !p.bad && p.flag).length;
    status.innerHTML = caught === 3 && !wrong
      ? "<b>All three contaminated readings flagged.</b> The mean and median now agree. Notice the median was already close before you flagged anything: that is why CoolCairo uses it."
      : `<b>${caught} of 3</b> contaminated readings flagged${wrong ? `, ${wrong} clear reading${wrong > 1 ? "s" : ""} flagged by mistake` : ""}. Clouds read far too cold; shadows a few degrees too cold.`;
  }
  const again = el("button", { class: "btn small", text: "New pixel", onclick: () => { newPixel(); update(); } });
  update();
  box.append(el("div", { class: "viz-box" }, f.svg), el("div", { class: "legend-row" }, [el("span", { html: '<i style="background:var(--bad)"></i>Mean (dashed)' }), el("span", { html: '<i style="background:var(--good)"></i>Median' }), el("span", { text: "Click a bar to flag or unflag it." })]),
    el("div", { class: "readout" }, [meanR.wrap, medR.wrap, truthR.wrap]), status, again);
};

// ---------------------------------------------------------------- 6. spectral fingerprints
const MATERIALS = {
  // Sentinel-2 band reflectances: blue, green, red, NIR, SWIR1, SWIR2
  Vegetation: { b: [0.04, 0.08, 0.05, 0.40, 0.22, 0.12], col: "#548c45" },

LABS.claims = (box, api) => {
  const CLAIMS = [

    ["The heat model explains about a quarter of the differences between blocks, tested on whole areas it never saw.", true, "Supported: R² 0.25 with spatial cross-validation on hidden 1 km squares."],
    ["Targeting the riskiest third cuts more heat exposure than treating every block.", false, "Overclaim: every block also gives −74%. Targeting gives the same cut with far less area: 'knowing where pays'."],
    ["We know the temperature of every building in Nasr City.", false, "Overclaim: the heat sensor sees ~100 m, so results are per 90 m block only."],
    ["Hyperspectral EnMAP explained block heat better than Sentinel-2 in every test city with a scene.", true, "Supported: Cairo, Algiers, Dubai and Riyadh, different seasons and years."],
    ["Dark roofs are cooler than pale roofs in Cairo.", false, "Unsupported: the coefficient fails the sign check. Cause not confirmed; dark roofs cover only ~0.5% of an urban block."],
    ["Material labels agree with high-resolution imagery at 89% of 18 checked points, in a check that was not blind.", true, "Supported and honestly phrased. A blind repeat is the next step."],
    ["Heat exposure shows which residents are most vulnerable.", false, "Overclaim: it is residents × degrees above typical. Age, housing and cooling access are not included."],
    ["New districts are about 1 °C hotter than mature ones, mostly because they are still sandy and less built up.", true, "Supported: +0.95 °C raw, about +0.2 °C after allowing for cover, sand and vegetation."],
